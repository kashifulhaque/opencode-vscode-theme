name: Release VS Code Theme

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install VSCE
        run: bun add -g @vscode/vsce

      - name: Build VSIX
        run: |
          rm -f *.vsix
          vsce package

      - name: Read package version
        run: |
          echo "VERSION=$(bun -e \"console.log(require('./package.json').version)\")" >> $GITHUB_ENV
          echo "NAME=$(bun -e \"console.log(require('./package.json').name)\")" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: ${{ env.NAME }}-${{ env.VERSION }}.vsix
